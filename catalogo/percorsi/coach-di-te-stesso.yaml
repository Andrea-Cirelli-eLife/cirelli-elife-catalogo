descrizione: |
  Il percorso annuale comprende l'intero ciclo dei corsi della scuola e i primi due
  Master eLife. È dedicato a chi vuole acquisire il metodo per sé: riconoscere i
  propri automatismi, gestire autonomamente emozioni e relazioni, usare il Viaggio
  Interiore Guidato senza doverne dipendere.
