descrizione: |
  Diventare eLife Coach significa acquisire un metodo, degli strumenti e soprattutto
  una capacità concreta di accompagnare persone e gruppi verso obiettivi di
  cambiamento, crescita e potenziamento.

  L'eLife Coach è un professionista del coaching formato all'interno della scuola eLife
  secondo il modello della Tripnosi, un approccio integrato che lavora sui diversi
  livelli attraverso i quali la persona percepisce sé stessa, gli altri e la propria
  realtà.

  Il suo compito non è fornire soluzioni preconfezionate, ma creare le condizioni
  perché la persona possa riconoscere e utilizzare meglio le proprie risorse, superare
  ostacoli e schemi limitanti, definire i propri obiettivi e costruire strategie
  efficaci per raggiungerli.

  L'eLife Coach può operare con singole persone, gruppi e organizzazioni, applicando le
  competenze acquisite nell'ambito personale, relazionale, professionale e aziendale.

daConfermare:
