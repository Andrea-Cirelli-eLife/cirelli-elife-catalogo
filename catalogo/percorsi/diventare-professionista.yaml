descrizione: |
  Diventare eLife Coach significa acquisire un metodo, degli strumenti e soprattutto
  la capacità concreta di accompagnare persone e gruppi verso obiettivi di
  cambiamento, crescita e potenziamento.

  Il percorso nasce da un principio: conoscere una tecnica non significa ancora
  saperla utilizzare professionalmente. Il primo anno è dedicato alla formazione e
  all'esperienza personale; il secondo alla professionalizzazione, con una
  rifrequenza attiva in cui l'allievo partecipa alle esercitazioni, affianca gli
  altri partecipanti e sperimenta progressivamente il ruolo dell'eLife Coach.

  Tre passaggi progressivi: sapere, saper fare, saper essere.
daConfermare:
  - Piano rateale su due anni
