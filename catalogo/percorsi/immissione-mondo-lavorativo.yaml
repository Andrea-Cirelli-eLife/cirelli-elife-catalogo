id: immissione-mondo-lavorativo
# Nome dal documento «MODIFICHE SITI 26_09» (p. 2): «Percorso professionale
# personalizzato · Biennale · con affiancamento individuale». «Biennale» lo
# mostrano già i siti, dalla durata. L'id resta quello vecchio: è negli indirizzi
# `?voce=` dei moduli.
titolo: Percorso professionale personalizzato
sottotitolo: Con affiancamento individuale
ordine: 3
durata: biennale
# Calendario eLife 2026/2027: il percorso parte con il primo weekend formativo.
annoFormativo:
  nome: 2026/2027
  inizio: 2027-02-06
prezzo:
  pieno: 13400
comprende:
  corsi:
    - workshop-intro
    - centratura-emotiva
    - relazione-profonda
    - linguaggio-inconscio
    - tipologie-umane-1
    - tipologie-umane-2
    - tripnosi-tre-livelli
    - comunicazione-persuasiva
    - parlare-in-pubblico
  master:
    - master-1
    - master-2
    - master-3
  extra:
    - Tutto quanto previsto dal percorso biennale
    - Inserimento nel mondo del lavoro
    - Supervisione diretta del dott. Andrea Cirelli
descrizione: |
  Il livello più alto del percorso formativo: al biennale si aggiungono
  l'accompagnamento nell'inserimento professionale e la supervisione diretta
  del dott. Cirelli.
daConfermare:
  - "Prezzo e valore a listino: il foglio del 10 settembre 2026 ricalcola l'annuale e il biennale, questo percorso no"
  - Cosa comprende l'immissione nel mondo lavorativo
  - Numero di ore di supervisione con il dott. Cirelli
  - Piano rateale
  - "Con il nuovo nome (26/09/2026) extra e descrizione parlano ancora di «inserimento nel mondo del lavoro»: da confermare se resta o se diventa «affiancamento individuale»"
