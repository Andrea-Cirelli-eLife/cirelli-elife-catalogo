id: andrea-cirelli
nome: Andrea Cirelli
ruolo: Psicologo, psicoterapeuta, formatore e coach
bio: >-
  Laureato in Psicologia all'Università di Bologna, specializzato in Psicoterapia
  Breve Analogica (Istituto di Psicologia Analogica di Milano, dove ha conseguito
  anche la certificazione di Master Trainer) e in Psicoterapia Breve Strategica
  (Centro di Terapia Strategica di Arezzo, con Master in Problem Solving Strategico).
  Advanced Clinical Hypnotherapist presso la National Guild of Hypnotists, USA.
  Dal 1990 docente, formatore e coach in Italia e all'estero; dal 1999 psicoterapeuta.
  Fondatore di MEPAI e, nel 2026, di eLife — Entanglement Life APS. Ideatore del
  modello RDE e della tecnica del Viaggio Interiore Guidato, strumento principe
  della Tripnosi.
