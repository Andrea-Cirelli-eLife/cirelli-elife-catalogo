id: tripnosi-tre-livelli
titolo: "Tripnosi: viaggio nell'ipnosi a tre livelli"
sottotitolo: Accedere e far accedere a risorse profonde attraverso stati di coscienza non ordinari
famiglia: corso
ordine: 7
durataGiorni: 4
durataNota: 2 + 2 giorni, oppure 4 giorni in formato residenziale
prezzo:
  pieno: 935
includeConsulenza: true
docenti: [andrea-cirelli]
abstract: >-
  Il cuore operativo del metodo: accedere alle risorse profonde della mente
  attraverso stati di coscienza non ordinari, e imparare a farvi accedere gli altri.
descrizione: |
  È il corso in cui il metodo si mostra per intero. Fin qui si è imparato a
  leggere e a comunicare; qui si impara ad accedere, e a far accedere.

  Lavoreremo sui tre livelli dell'inconscio che danno il nome al metodo:
  l'inconscio percettivo-reattivo, fatto di automatismi e autoinganni; l'inconscio
  benemegliano, l'istanza con cui è possibile aprire un vero negoziato; e
  l'inconscio transdimensionale, dove emergono risorse che non derivano
  direttamente dall'esperienza.

  Si lavora con l'ipnosi dinamica, con trance e senza trance, e si impara a
  condurre il Viaggio Interiore Guidato: non soltanto a viverlo, ma ad
  accompagnarci un'altra persona. È il passaggio che separa chi ha fatto
  un'esperienza da chi può offrirla.
obiettivi:
  - Accedere consapevolmente ai propri stati di coscienza non ordinari
  - Condurre il Viaggio Interiore Guidato su un'altra persona
  - Riconoscere i tre livelli dell'inconscio e sapere su quale si sta lavorando
  - Impostare e sostenere un negoziato con l'inconscio
  - Gestire ciò che emerge, compreso l'imprevisto
programma:
  - I tre livelli dell'inconscio nel modello della sfera
  - Ipnosi dinamica con trance e senza trance
  - Induzione, mantenimento e chiusura in sicurezza
  - Il negoziato con l'inconscio - protocollo e varianti
  - La decompressione energetico-emozionale
  - Cenni di inconscio transdimensionale ed entanglement
  - Pratica a coppie e in piccoli gruppi, con supervisione costante
daConfermare:
  - "I 935 € sono la coppia: il foglio del 10 settembre quota TRIP1 440 € e TRIP2 660 €. Se i due moduli si vendono separati, vanno separati anche qui"
  - Descrizione da validare
  - >-
    Se il prezzo valga anche per il formato residenziale da quattro giorni
