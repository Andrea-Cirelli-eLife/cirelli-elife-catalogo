# Testo: «TESTI FINALI DEI CORSI», 7 ottobre 2026.
abstract: >-
  La filosofia analogica e le integrazioni strategiche per evolvere in tempi brevi e
  imparare ad autogestirsi sia nel trattamento del disagio che nel promuovere risorse
  ancora inespresse.
descrizione: |
  Togli la maschera, supera le tue paure, persegui i tuoi sogni.

  Tecniche di Life Coaching da applicare su se stessi nella prospettiva analogica: il
  negoziato emotivo, le decompressioni energetico-emozionali e la ristrutturazione sui
  due livelli: inconscio e comportamentale.

  Al centro del corso c'è l'essere umano con i suoi limiti e le sue potenzialità.

  Lo stare bene con se stessi, già per Freud, è un obiettivo che solo una minoranza di
  persone raggiunge spontaneamente, senza acquisizione di tecniche di crescita personale
  o psicologiche. Malesseri e insoddisfazioni esistenziali depotenziano il vivere
  quotidiano declinato nelle sue aree.

  Secondo il modello analogico l'essere umano soffre a causa di una di queste due grandi
  crisi: di identità ed esistenziale.

  Nella prima, la persona ha paura di se stessa, di non valere e accusa tipicamente
  sensi di colpa e varie forme di auto-attribuzioni negative. Nella seconda, quella
  esistenziale, il timore è rivolto agli altri, la persona per paura di essere delusa e
  soffrire, non riesce a identificare i propri sogni e di conseguenza non si concede la
  possibilità di vivere pienamente o i rapporti sentimentali affettivi o
  l'autorealizzazione, creatività, lavoro.

  Il corso, con gli strumenti operativi collaudati da anni su migliaia di allievi, si
  propone di far riconoscere e gestire il proprio copione disfunzionale della
  personalità per abbattere il disagio in tempi brevi.

  Per chi si sente già abbastanza capace a perseguire i propri desideri e a coltivare le
  relazioni con gli altri con discreto appagamento, il metodo può essere di stimolo per
  ottenere un ulteriore potenziamento personale e maggior benessere, armonia interiore e
  qualità della vita.
obiettivi:
  - Utilizzare le decompressioni energetico-emozionali, abbinando, quando c'è la necessità, gli opportuni stratagemmi mentali
  - Apprendere le tecniche avanzate del negoziato con l'inconscio
  - Apprendere la tecnica di «future regeneration»
programma:
  - I segreti della mente inconscia spiegati grazie alle scoperte delle Discipline Analogiche
  - "Le cause dei disagi: come una ordinaria difficoltà della vita quotidiana si trasforma in un problema secondo il modello analogico e strategico"
  - Sistemi percettivo-reattivi e stratagemmi mentali
  - Le profezie genitoriali
  - I complessi, i difetti, i sigilli emotivi
  - "I principi non negoziabili dell'essere umano di: libertà, sogno, coscienza e destino"
  - "L'approccio analogico e strategico: dalla conoscenza all'azione"
