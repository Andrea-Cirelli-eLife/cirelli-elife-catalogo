# Testo: «TESTI FINALI DEI CORSI», 7 ottobre 2026. «Threepnosi» è reso «Tripnosi».
abstract: >-
  La filosofia strategica e le integrazioni analogiche per evolvere adesso, ora, subito.
descrizione: |
  «La vita non è ciò che ci accade, ma ciò che facciamo con ciò che ci accade» (A. Huxley).

  Quando una persona si trova in uno stato di emergenza emotiva o relazionale ha la
  necessità di intervenire immediatamente accedendo ad una sorta di pronto soccorso
  emotivo.

  Si tratta della stessa dinamica che si ritrova in coloro che, infortunati, chiamano
  un'ambulanza e si fanno portare in pronto soccorso. Qui l'intervento consiste nel
  gestire il dolore, stabilizzare il trauma acuto, contenere un'infezione, bloccare
  l'emorragia.

  Talvolta può essere sufficiente questo primo intervento che lavora sul sintomo,
  soprattutto se la persona è addestrata a proseguire l'automedicazione a casa e ad
  applicare le operazioni terapeutiche su se stessa.

  Molte volte, invece, è necessario, immaginando il classico pronto soccorso al piano
  terra della struttura ospedaliera, passare ai piani superiori dove i medici
  specialisti vanno a indagare la causa prima del malessere per intervenire, quando
  serve, chirurgicamente.

  Il pronto soccorso, nel nostro modello, è rappresentato dall'approccio strategico che
  studia il COME, ovvero cosa prima di tutto non fare di fronte ad un disagio e quali
  stratagemmi mentali o relazionali adottare per sbloccare l'emergenza.

  Il cuore del modello Tripnosi è il lavoro sul PERCHÉ: ai piani superiori, per
  rimanere nell'analogia ospedaliera, si accede all'ecografia emozionale e, quando
  necessario, alla chirurgia emozionale, con l'obiettivo di individuare e rimuovere la
  causa a monte del problema.

  Si intuisce quanto sia importante lavorare sulle vere cause del problema, cioè le
  compressioni energetico emozionali storiche, ma quanto è importante avere sottomano il
  ghiaccio o le bende per medicare una botta, piuttosto che il disinfettante per una
  ferita?

  La Tripnosi nasce per integrare l'azione sul COME e sul PERCHÉ, rendendo la persona
  autonoma sia nella gestione dell'urgenza sia nell'individuazione e nella
  trasformazione delle radici profonde del proprio disagio.
obiettivi:
  - Utilizzare il pronto soccorso emotivo e relazionale su se stessi e gli altri
  - Gestire il conflitto e gli autoinganni nella relazione con se stessi, gli altri e il mondo
  - Potenziamento personale e una crescita tangibile e significativa nelle relazioni personali e professionali
programma:
  - Procedure per individuare i circoli viziosi che agiscono sotto il profilo livello razionale-logico
  - Un ventaglio di stratagemmi mentali e relazionali raccolti e selezionati in trent'anni di sperimentazioni con migliaia di allievi nella gestione del conflitto e nel potenziamento personale
  - Il dialogo strategico integrato con i linguaggi non verbali dell'approccio analogico-emozionale
