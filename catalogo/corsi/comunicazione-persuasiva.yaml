# Testo: «TESTI FINALI DEI CORSI», 7 ottobre 2026. Sostituisce quello scritto da VEDA.
abstract: >-
  Comunicare non significa soltanto esprimere bene ciò che pensiamo. Significa saper
  creare le condizioni perché l'altro abbia piacere ad ascoltarci, comprenderci e
  accogliere ciò che proponiamo, anche quando parte da una posizione diversa dalla
  nostra.
descrizione: |
  Questo corso insegna a utilizzare parole, frasi e strategie di dialogo per aumentare
  la propria efficacia comunicativa e la propria autorevolezza, integrando la
  comunicazione persuasiva in chiave analogica con strumenti strategici di gestione dei
  contrasti e dei conflitti.

  L'obiettivo non è imporre il proprio punto di vista, ma imparare a guidare il dialogo,
  creare empatia, gestire le resistenze e trasformare opposizioni e divergenze in
  possibilità di relazione, negoziazione e consenso.

  Le tecniche possono essere utilizzate nelle relazioni professionali, nella coppia, in
  famiglia e, più in generale, in tutte quelle situazioni nelle quali essere ascoltati,
  comprendere l'altro e trovare un punto d'incontro può fare la differenza.
obiettivi:
  - Potenziare la capacità di essere ascoltato e compreso
  - Creare rapidamente un rapporto empatico positivo con uno o più interlocutori
  - Utilizzare parole, frasi e modalità di dialogo capaci di favorire apertura e consenso
  - Aumentare la tua autorevolezza comunicativa senza ricorrere allo scontro
  - Riconoscere la differenza tra contrasto, potenzialmente costruttivo, e conflitto, spesso dannoso per la relazione
  - Riconoscere e gestire le tue reazioni emotive prima che compromettano il rapporto
  - Affrontare giudizi, critiche e opposizioni mantenendo il controllo del dialogo
  - Gestire situazioni comunicative difficili attraverso tecniche di negoziazione
  - Trasformare resistenze e divergenze in occasioni di confronto e collaborazione
programma:
  - "Il R.E.P. – Rapporto Empatico Positivo: come entrare in sintonia con uno o più interlocutori, anche quando il dialogo parte da posizioni distanti o difficili"
  - "La comunicazione persuasiva: parole, frasi e modalità comunicative derivate e integrate dagli approcci analogico, neurolinguistico e strategico"
  - "La fase induttiva e il pilotaggio del dialogo: i passaggi attraverso i quali il comunicatore smette di essere una presenza neutra e diventa progressivamente una fonte significativa di stimolazione per l'interlocutore"
  - "La persuasione analogica: come utilizzare la dimensione emotiva della comunicazione per favorire ascolto, coinvolgimento e disponibilità"
  - "La gestione del contrasto e del conflitto: come riconoscere ciò che accade dentro di noi e nella relazione quando nasce un'opposizione, evitando che una semplice divergenza si trasformi in uno scontro"
  - "L'autocontrollo interattivo: strumenti del modello analogico per gestire le proprie reazioni emotive e mantenere efficacia e lucidità nella relazione"
  - "Il negoziato emozionale: tecniche di primo, secondo e terzo livello per intervenire inizialmente sul proprio vissuto emotivo e successivamente nella relazione con l'altro"
  - "La negoziazione analogica e strategica: come affrontare resistenze, critiche e posizioni contrapposte costruendo le condizioni per un possibile accordo"
  - "Le esercitazioni pratiche: simulazioni e prove guidate per imparare a ottenere il Sì attraverso una comunicazione più efficace, naturale e persuasiva"
