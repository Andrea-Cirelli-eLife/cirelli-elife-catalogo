# Testo corretto da Andrea il 7 ottobre 2026: «WORKSHOP TRIPNOSI, MODIFICHE TESTO»,
# lo stesso di «TESTI FINALI DEI CORSI».
abstract: >-
  Seconda porta — ottieni il meglio nella relazione con gli altri. Andare oltre
  lo scambio di parole per incontrare il mondo emotivo dell'interlocutore.
descrizione: |
  Per conquistare questo ruolo bisogna imparare a riconoscere e utilizzare le chiavi
  di accesso al mondo emotivo e inconscio dell'altra persona, creando gradualmente un
  coinvolgimento sempre più profondo.

  Il principio è più semplice di quanto possa sembrare. Quando un figlio viene
  fortemente coinvolto dal «maranza» della scuola o del quartiere, può accadere perché
  quest'ultimo è riuscito a diventare per lui un simbolo più potente di quanto sia
  riuscito a fare il genitore. Allo stesso modo, quando un valido collaboratore lascia
  un'azienda per passare a un competitor, non è necessariamente solo una questione
  economica: talvolta dall'altra parte qualcuno ha saputo ascoltarlo, comprenderlo e
  coinvolgerlo più profondamente.

  Un esempio quasi tragicomico lo troviamo nelle relazioni sentimentali. Un uomo può
  accorgersi che sta perdendo la propria compagna e convincersi che il presunto
  antagonista la stia conquistando perché è più mascolino, più affascinante, più
  potente o dispone di maggiori possibilità economiche. E può non vedere proprio ciò
  che sta realmente facendo la differenza: quell'uomo è riuscito a comprenderla e a
  coinvolgere il suo mondo emotivo più profondamente. È diventato prima fonte di
  stimolazione e, progressivamente, simbolo. È lì che si sta giocando la partita, non
  necessariamente nelle qualità esteriori che il partner teme e alle quali attribuisce
  la propria sconfitta.

  Arriviamo addirittura a sostenere che anche un atto apparentemente ordinario come una
  contrattazione commerciale o l'acquisto di un prodotto o di un servizio possa essere,
  molto più spesso di quanto immaginiamo, un piccolo atto d'amore nei confronti di un
  venditore che ha saputo ascoltare, comprendere e coinvolgere.
programma:
  - Le basi del dialogo strategico
  - Le basi del dialogo analogico
  - Le fasi per passare da comunicatore neutro a fonte di stimolazione per arrivare poi a essere identificato «simbolo»
  - Esempi di applicazione nei rapporti affettivi, familiari, educativi, professionali e d'aiuto
  - Pratiche esperienziali in gruppo e in piccoli gruppi
