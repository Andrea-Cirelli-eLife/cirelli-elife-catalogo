  pieno: 220
includeConsulenza: true
porta: altri
docenti: []
abstract: >-
  Seconda porta — ottieni il meglio nella relazione con gli altri. Andare oltre
  lo scambio di parole per incontrare il mondo emotivo dell'interlocutore.
descrizione: |
  Ogni relazione avviene almeno su due livelli: quello di ciò che l'altro dice,
  pensa e mostra consapevolmente, e quello più profondo delle sue esigenze emotive.

  Dopo aver incontrato il tuo alleato interiore, in questo modulo il viaggio si apre
  all'altro. Imparerai a creare una relazione capace di andare oltre il semplice
  scambio di parole, per comprendere, coinvolgere e comunicare con il mondo emotivo
  profondo del tuo interlocutore.

  Perché prima di poter guidare una relazione occorre creare sintonia. È qui che
  entra in gioco la seduzione, intesa nel suo significato più ampio: non come
  conquista o manipolazione, ma come capacità di attrarre l'altro nella relazione
  facendolo sentire profondamente visto, compreso e coinvolto.

  La seduzione precede la relazione. Precede l'educazione, perché un figlio ha
  bisogno di sentirsi compreso prima di lasciarsi guidare. Precede un contratto,
  perché un cliente vuole sentire che hai compreso ciò che per lui conta davvero.
programma:
  - "Entrare in sintonia con l'altro: creare le condizioni per una relazione autentica"
  - "Incontrare l'alleato interiore dell'altro: riconoscere e coinvolgere le sue esigenze emotive"
  - "La seduzione precede la relazione"
  - "Le basi del dialogo strategico: gestire resistenze, rigidità e meccanismi di difesa"
  - "Le basi del dialogo analogico: comunicare a un livello emozionale più profondo"
  - Dalla propria realtà alla realtà dell'altro
  - "Coinvolgere senza forzare"
  - Applicazioni nei rapporti affettivi, familiari, educativi, professionali e d'aiuto
  - Esperienze in piccoli gruppi
