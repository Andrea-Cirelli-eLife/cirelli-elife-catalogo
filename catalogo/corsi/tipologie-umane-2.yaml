# Testo: «TESTI FINALI DEI CORSI», 7 ottobre 2026. Sostituisce quello scritto da VEDA.
# Il documento ha una sola frase introduttiva: fa da abstract, senza descrizione.
abstract: >-
  Per comprendere gli effetti delle prime relazioni della nostra vita nella gestione
  da adulti dei rapporti sentimentali affettivi, lavorativi e relazionali in genere.
obiettivi:
  - Conoscere a fondo te stesso e gli altri
  - Evitare relazioni potenzialmente dannose
  - Costruire relazioni serene e motivanti in qualsiasi ambito della vita
  - La comunicazione inconscia come strumento per realizzare entanglement ovvero interconnessione profonda con se stessi, gli altri, il mondo
programma:
  - "Le tappe evolutive dell'essere umano: come diventiamo una tipologia asta (paterna), triangolo (materna), cerchio (egocentrica)"
  - "Il pathos e la reattività: conoscere e riconoscere la metà del mondo che si coinvolge nella dinamica piacere/sofferenza e l'altra metà che si coinvolge nella dinamica risentimenti/sensi di colpa"
  - "Oggetti del desiderio e antagonisti reali e presunti: motivazione e gestione di insicurezze, gelosie e tendenze al contrasto e al conflitto"
  - "Le triadi: scopri come e perché nascono delle paure e delle incomprensioni profonde con gli altri che possono portare alla rottura di relazioni private e professionali potenzialmente gratificanti"
  - Laboratorio pratico esperienziale
daConfermare:
  - Se "Tipologie umane 1" sia prerequisito obbligatorio o consigliato
