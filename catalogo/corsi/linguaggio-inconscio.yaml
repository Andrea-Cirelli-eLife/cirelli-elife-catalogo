id: linguaggio-inconscio
titolo: Il linguaggio dell'inconscio
sottotitolo: Decodifica in tempo reale desideri e motivazioni tuoi e degli altri
famiglia: corso
ordine: 4
durataGiorni: 2
prezzo:
  pieno: 560
  early: 440
includeConsulenza: true
docenti: [andrea-cirelli]
abstract: >-
  Ogni relazione passa dal corpo, ancora prima che dalle parole. Imparare a
  cogliere i segnali corporei, emozionali e subliminali che sfuggono alla
  percezione cosciente.
descrizione: |
  Spesso non sappiamo riconoscere ciò che il nostro inconscio — e quello degli altri
  — sta già comunicando. Questo porta a incomprensioni, comunicazioni superficiali,
  difficoltà relazionali e segnali emotivi ignorati fino a quando diventano disagio,
  conflitto o distanza.

  Il corso nasce per aiutarti a sviluppare una lettura più profonda, veritiera e
  immediata delle dinamiche umane. Attraverso un approccio non convenzionale
  imparerai a cogliere segnali corporei, emozionali e subliminali che normalmente
  sfuggono alla percezione cosciente.

  È un'esperienza pensata per chi desidera comunicare in modo più autentico, creare
  connessioni reali e sviluppare maggiore presenza, carisma e consapevolezza.
obiettivi:
  - Leggere segnali di gradimento, rifiuto, tensione, incongruenza e disagio
  - Riconoscere segnali profondi di opportunità, allarme e dolore
  - Migliorare la capacità comunicativa in modo naturale ed efficace
  - Sviluppare maggiore carisma, leadership e capacità di coinvolgimento
  - Creare relazioni più autentiche, profonde e consapevoli
programma:
  - Tecniche di osservazione e lettura della comunicazione non verbale
  - Analisi dei segnali analogici del corpo su noi stessi e sugli altri
  - "«La realtà non esiste»: basi di filosofia costruttivista-strategica"
  - Il dialogo strategico
  - Esercitazioni con l'allievo in ruolo attivo
  - Simulazioni di scambi relazionali
  - Osservazione di foto, video e casi reali
  - Esperienze dirette sui partecipanti volontari
